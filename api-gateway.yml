server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: demo-api
          uri: lb://DEMO-API
          predicates:
            - Path=/hello

  boot:
    admin:
      client:
        url: http://localhost:1111

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      access: unrestricted
